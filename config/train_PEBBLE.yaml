defaults:
    - agent: sac_metaworld

experiment: PRIMT

segment: 100
activation: tanh
num_seed_steps: 1000
num_unsup_steps: 9000
num_interact: 5000
reward_lr: 0.0003
reward_batch: 50
reward_update: 10
feed_type: 1
reset_update: 100
topK: 5
ensemble_size: 3
max_feedback: 20000
large_batch: 10
label_margin: 0.0
teacher_beta: -1
teacher_gamma: 1
teacher_eps_mistake: 0
teacher_eps_skip: 0
teacher_eps_equal: 0

primt:
    num_foresight_traj: 200
    traj_buffer_size: 300

    crowd_k: 3
    conf_alpha: 0.5
    intra_enable: true
    inter_mode: psl
    max_keyframes: 20
    vd_scale: null
    td_scale: null
    keyframe:
        delta_v: null
        delta_e: null
        smooth_k: null
        smooth_topk: null
        cpd_penalty: null

    cf_enable: true
    cf_conf_thresh: 0.8
    cf_verify: true
    cf_to_buffer: true
    cf_l1_thresh: 0.3
    cf_batch: 32
    cf_max_per_traj: 5
    lambda_cf: 0.05
    lambda_cf_adaptive: false
    fm:
        backend: scripted
        llm_model: gpt-6-astra
        vlm_model: gpt-6-astra
        api_key_env: OPENAI_API_KEY
        base_url: null
        temperature: 0.7
        max_retries: 3
        workers: 4
        camera: corner
        resolution: 224

reward_schedule: 0

num_train_steps: 1e6
replay_buffer_capacity: ${num_train_steps}

eval_frequency: 10000
num_eval_episodes: 10
device: cuda

log_frequency: 10000
log_save_tb: true

save_video: false

seed: 1

env: metaworld_button-press-v2
gradient_update: 1

hydra:
    name: ${env}
    run:
        dir: ./exp/${env}/H${diag_gaussian_actor.params.hidden_dim}_L${diag_gaussian_actor.params.hidden_depth}_lr${agent.params.actor_lr}/teacher_b${teacher_beta}_g${teacher_gamma}_m${teacher_eps_mistake}_s${teacher_eps_skip}_e${teacher_eps_equal}/label_smooth_${label_margin}/schedule_${reward_schedule}/${experiment}_init${num_seed_steps}_unsup${num_unsup_steps}_inter${num_interact}_maxfeed${max_feedback}_seg${segment}_act${activation}_Rlr${reward_lr}_Rbatch${reward_batch}_Rupdate${reward_update}_en${ensemble_size}_sample${feed_type}_large_batch${large_batch}_seed${seed}
